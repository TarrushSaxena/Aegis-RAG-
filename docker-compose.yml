services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    ports:
      - "8010:8010"
    volumes:
      - ./backend/app:/app/app
      - rag_data:/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload"

  worker:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      - backend
      - redis
      - qdrant
    volumes:
      - ./backend/app:/app/app
      - rag_data:/data
    command: celery -A app.tasks.ingestion_tasks:celery_app worker --loglevel=INFO

volumes:
  postgres_data:
  qdrant_data:
  rag_data:
